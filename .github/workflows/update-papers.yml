name: Atualizar papers e publicar o site

on:
  schedule:
    - cron: "0 9 * * *"   # todo dia às 06:00 (horário de Brasília)
  push:
    branches: [main]
  workflow_dispatch:      # botão "Run workflow" na aba Actions

permissions:
  contents: write         # para salvar data/papers.json no repositório
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # Parte 1: busca os papers no ADS e prepara o site
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Buscar papers nas bibliotecas do ADS
        continue-on-error: true   # se o ADS falhar, o site é publicado com a lista anterior
        env:
          ADS_TOKEN: ${{ secrets.ADS_TOKEN }}
        run: |
          pip install requests
          python scripts/update_papers.py

      - name: Salvar data/papers.json no repositório
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898231+github-actions[bot]@users.noreply.github.com"
          git add data/papers.json 2>/dev/null || true
          if ! git diff --staged --quiet; then
            git commit -m "Atualiza lista de papers (ADS)"
            git pull --rebase
            git push
          fi

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v5
        with:
          path: .

  # Parte 2: publica (fica num job separado para o GitHub encontrar o site preparado na parte 1)
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
